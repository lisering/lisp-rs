<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 614" width="1330" height="614">
  <defs>
    <marker id="arrow" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L5,2 L0,4 Z" fill="#6c757d"/>
    </marker>
  </defs>

  <!-- 入口 -->
  <rect x="500" y="20" width="320" height="80" rx="16" fill="#f8f9fa" stroke="#495057" stroke-width="4"/>
  <text x="660" y="70" text-anchor="middle" font-size="26" font-family="sans-serif" font-weight="bold" fill="#495057">eval encounters List</text>

  <line x1="660" y1="100" x2="660" y2="140" stroke="#6c757d" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 判断菱形 -->
  <polygon points="660,140 820,210 660,280 500,210" fill="#f8f9fa" stroke="#495057" stroke-width="4"/>
  <text x="660" y="216" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="bold" fill="#495057">first element = ?</text>

  <!-- 左列: quote (直接返回, 蓝色) -->
  <line x1="523" y1="220" x2="180" y2="220" stroke="#6c757d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="162" y="202" width="36" height="36" rx="6" fill="#cce5ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="180" y="226" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#0d6efd">Q</text>
  <rect x="20" y="250" width="280" height="80" rx="12" fill="#cce5ff" stroke="#0d6efd" stroke-width="3"/>
  <text x="160" y="280" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#0d6efd">quote</text>
  <text x="160" y="308" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#0d6efd">prevent eval, return args as-is</text>

  <!-- 左列: define (直接返回, 蓝色 ← 从绿色修正) -->
  <line x1="569" y1="245" x2="180" y2="330" stroke="#6c757d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="162" y="312" width="36" height="36" rx="6" fill="#cce5ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="180" y="336" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#0d6efd">D</text>
  <rect x="20" y="360" width="280" height="80" rx="12" fill="#cce5ff" stroke="#0d6efd" stroke-width="3"/>
  <text x="160" y="390" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#0d6efd">define</text>
  <text x="160" y="418" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#0d6efd">variable definition, returns Nil</text>

  <!-- 左列: lambda (直接返回, 蓝色) -->
  <line x1="614" y1="270" x2="180" y2="440" stroke="#6c757d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="162" y="422" width="36" height="36" rx="6" fill="#cce5ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="180" y="446" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#0d6efd">λ</text>
  <rect x="20" y="470" width="280" height="80" rx="12" fill="#cce5ff" stroke="#0d6efd" stroke-width="3"/>
  <text x="160" y="500" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#0d6efd">lambda</text>
  <text x="160" y="528" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#0d6efd">create closure, returns Lambda</text>

  <!-- 右列: if (TCO, 绿色) -->
  <line x1="797" y1="220" x2="1140" y2="220" stroke="#6c757d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1122" y="202" width="36" height="36" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="1140" y="226" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#28a745">✓</text>
  <rect x="1010" y="250" width="300" height="80" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3"/>
  <text x="1160" y="280" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#28a745">if</text>
  <text x="1160" y="308" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#28a745">conditional branch, TCO</text>

  <!-- 右列: let (TCO, 绿色) - 新增 -->
  <line x1="751" y1="245" x2="1140" y2="330" stroke="#6c757d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1122" y="312" width="36" height="36" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="1140" y="336" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#28a745">✓</text>
  <rect x="1010" y="360" width="300" height="80" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3"/>
  <text x="1160" y="390" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#28a745">let</text>
  <text x="1160" y="418" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#28a745">local binding, TCO</text>

  <!-- 右列: cond / and / or (TCO, 绿色) -->
  <line x1="706" y1="270" x2="1140" y2="440" stroke="#6c757d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1122" y="422" width="36" height="36" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="1140" y="446" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#28a745">✓</text>
  <rect x="1010" y="470" width="300" height="80" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3"/>
  <text x="1160" y="500" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#28a745">cond / and / or</text>
  <text x="1160" y="528" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#28a745">multi-way/short-circuit, TCO</text>

  <!-- 底部: regular function call (TCO, 绿色) -->
  <line x1="660" y1="280" x2="660" y2="330" stroke="#6c757d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="642" y="312" width="36" height="36" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="660" y="336" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#28a745">→</text>
  <rect x="520" y="360" width="280" height="80" rx="12" fill="#d4edda" stroke="#28a745" stroke-width="3"/>
  <text x="660" y="390" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#28a745">regular function call</text>
  <text x="660" y="418" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#28a745">eval func + args, TCO</text>

  <!-- 图例 -->
  <rect x="20" y="570" width="24" height="24" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="52" y="589" font-size="20" font-family="sans-serif" fill="#28a745">= TCO path (tail call optimization)</text>
  <rect x="360" y="570" width="24" height="24" rx="6" fill="#cce5ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="392" y="589" font-size="20" font-family="sans-serif" fill="#0d6efd">= direct return</text>
</svg>

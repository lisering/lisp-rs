<svg width="900" height="450" viewBox="0 0 900 450" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.label { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 17px; fill: #495057; font-weight: 600; }
.code { font-family: 'SF Mono', monospace; font-size: 15px; fill: #868E96; }
.token { font-family: 'SF Mono', monospace; font-size: 18px; fill: #0D6EFD; font-weight: 700; }
.result { font-family: 'SF Mono', monospace; font-size: 16px; fill: #0D6EFD; font-weight: 700; }
</style>
</defs>

<text x="450" y="35" text-anchor="middle" class="label" fill="#0D6EFD" font-size="20">递归下降解析：Tokens → AST</text>

<text x="40" y="75" class="label">Tokens:</text>

<rect x="140" y="55" width="60" height="36" rx="6" fill="#E3F2FD" stroke="#0D6EFD" stroke-width="2"/>
<text x="170" y="79" text-anchor="middle" class="token">(</text>

<rect x="215" y="55" width="60" height="36" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
<text x="245" y="79" text-anchor="middle" class="token">+</text>

<rect x="290" y="55" width="60" height="36" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
<text x="320" y="79" text-anchor="middle" class="token">1</text>

<rect x="365" y="55" width="60" height="36" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
<text x="395" y="79" text-anchor="middle" class="token">2</text>

<rect x="440" y="55" width="60" height="36" rx="6" fill="#E3F2FD" stroke="#0D6EFD" stroke-width="2"/>
<text x="470" y="79" text-anchor="middle" class="token">)</text>

<rect x="140" y="53" width="60" height="40" rx="6" fill="none" stroke="#dc3545" stroke-width="3">
<animate attributeName="x" values="140;140;215;215;290;290;365;365;440;440;440" dur="14s" repeatCount="indefinite" keyTimes="0;0.07;0.09;0.21;0.23;0.35;0.37;0.49;0.51;0.63;1"/>
</rect>

<text x="40" y="135" class="label">解析步骤：</text>

<text x="40" y="170" class="code" opacity="0" font-size="16">① 遇到 ( → 开始解析 List<animate attributeName="opacity" values="0;1;1;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.04;0.90;1"/></text>
<text x="40" y="200" class="code" opacity="0" font-size="16">② 读取 + → Symbol("+")<animate attributeName="opacity" values="0;0;1;1;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.21;0.23;0.90;1"/></text>
<text x="40" y="230" class="code" opacity="0" font-size="16">③ 读取 1 → Number(1.0)<animate attributeName="opacity" values="0;0;1;1;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.35;0.37;0.90;1"/></text>
<text x="40" y="260" class="code" opacity="0" font-size="16">④ 读取 2 → Number(2.0)<animate attributeName="opacity" values="0;0;1;1;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.49;0.51;0.90;1"/></text>
<text x="40" y="290" class="code" opacity="0" font-size="16">⑤ 遇到 ) → 结束 List<animate attributeName="opacity" values="0;0;1;1;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.63;0.65;0.90;1"/></text>

<text x="40" y="340" class="label">AST 结果：</text>

<rect x="40" y="355" width="820" height="80" rx="10" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
<text x="450" y="385" text-anchor="middle" class="result" opacity="0">LispExp::List(vec![<animate attributeName="opacity" values="0;0;1;1;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.65;0.67;0.90;1"/></text>
<text x="450" y="410" text-anchor="middle" class="result" opacity="0">  Symbol("+"), Number(1.0), Number(2.0)<animate attributeName="opacity" values="0;0;1;1;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.65;0.67;0.90;1"/></text>
<text x="450" y="428" text-anchor="middle" class="result" opacity="0">])<animate attributeName="opacity" values="0;0;1;1;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.65;0.67;0.90;1"/></text>
</svg>

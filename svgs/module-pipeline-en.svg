<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 820 400" width="820" height="400">
  <defs>
    <marker id="arrow" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L5,2 L0,4 Z" fill="#555"/>
    </marker>
    <marker id="arrow-dash" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L5,2 L0,4 Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Pipeline subgraph -->
  <rect x="0" y="0" width="580" height="160" rx="12" fill="#f0f7ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="290" y="28" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#4a90d9">Processing Pipeline</text>

  <!-- L1: Lexer -->
  <rect x="20" y="45" width="120" height="95" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="72" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#075985">Lexer</text>
  <text x="80" y="94" text-anchor="middle" font-size="14" font-family="monospace" fill="#075985">lexer.rs</text>
  <text x="80" y="118" text-anchor="middle" font-size="13" font-family="monospace" fill="#075985">⟹ Vec&lt;str&gt;</text>

  <line x1="140" y1="92" x2="170" y2="92" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- L2: Parser -->
  <rect x="175" y="45" width="120" height="95" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="235" y="72" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#065f46">Parser</text>
  <text x="235" y="94" text-anchor="middle" font-size="14" font-family="monospace" fill="#065f46">parser.rs</text>
  <text x="235" y="118" text-anchor="middle" font-size="13" font-family="monospace" fill="#065f46">⟹ LispExp AST</text>

  <line x1="295" y1="92" x2="325" y2="92" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- L3: Env -->
  <rect x="330" y="45" width="120" height="95" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="72" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#92400e">Environment</text>
  <text x="390" y="94" text-anchor="middle" font-size="14" font-family="monospace" fill="#92400e">env.rs</text>
  <text x="390" y="118" text-anchor="middle" font-size="13" font-family="monospace" fill="#92400e">lexical scope</text>

  <line x1="450" y1="92" x2="480" y2="92" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- L4: Eval -->
  <rect x="485" y="45" width="85" height="95" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="527" y="72" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#991b1b">Eval</text>
  <text x="527" y="94" text-anchor="middle" font-size="13" font-family="monospace" fill="#991b1b">interpreter.rs</text>
  <text x="527" y="118" text-anchor="middle" font-size="13" font-family="monospace" fill="#991b1b">Value</text>

  <!-- Shared infrastructure -->
  <rect x="620" y="0" width="180" height="160" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="710" y="28" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="bold" fill="#6d28d9">Shared Infrastructure</text>

  <rect x="640" y="45" width="140" height="95" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="710" y="72" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#6d28d9">🔗 interner.rs</text>
  <text x="710" y="94" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#6d28d9">string interner</text>
  <text x="710" y="118" text-anchor="middle" font-size="13" font-family="monospace" fill="#6d28d9">String ↔ u64</text>

  <!-- Dashed arrows to interner -->
  <path d="M295,140 C400,220 550,220 640,100" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="430" y="220" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#8b5cf6">symbol ref</text>

  <path d="M527,140 C560,200 600,200 640,120" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="560" y="180" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#8b5cf6">symbol ID</text>

  <path d="M450,140 C480,260 580,260 640,140" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="500" y="260" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#8b5cf6">var lookup</text>
</svg>

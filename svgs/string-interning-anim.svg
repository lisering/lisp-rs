<svg width="900" height="440" viewBox="0 0 900 440" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.label { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 17px; fill: #495057; font-weight: 600; }
.code { font-family: 'SF Mono', monospace; font-size: 15px; fill: #868E96; }
.id { font-family: 'SF Mono', monospace; font-size: 20px; fill: #4CAF50; font-weight: 700; }
.step { font-family: -apple-system, sans-serif; font-size: 14px; fill: #0D6EFD; font-weight: 600; }
</style>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6EFD"/>
</marker>
</defs>

<text x="450" y="35" text-anchor="middle" class="label" fill="#0D6EFD" font-size="20">字符串驻留：String → u64 映射</text>

<rect x="320" y="70" width="260" height="220" rx="12" fill="#F8F9FA" stroke="#6C757D" stroke-width="2.5"/>
<text x="450" y="100" text-anchor="middle" class="label">Interner 驻留器</text>
<text x="450" y="125" text-anchor="middle" class="code">HashMap&lt;String, u64&gt;</text>

<rect x="345" y="145" width="210" height="28" rx="4" fill="#E3F2FD" stroke="#0D6EFD" stroke-width="1.5"/>
<text x="450" y="164" text-anchor="middle" class="code">"if" → 0</text>

<rect x="345" y="180" width="210" height="28" rx="4" fill="#E3F2FD" stroke="#0D6EFD" stroke-width="1.5"/>
<text x="450" y="199" text-anchor="middle" class="code">"+" → 1</text>

<rect x="345" y="215" width="210" height="28" rx="4" fill="#E3F2FD" stroke="#0D6EFD" stroke-width="1.5"/>
<text x="450" y="234" text-anchor="middle" class="code">"define" → 2</text>

<rect x="345" y="250" width="210" height="28" rx="4" fill="#FFF3E0" stroke="#FF9800" stroke-width="2.5">
<animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite"/>
</rect>
<text x="450" y="269" text-anchor="middle" class="code">"lambda" → 3</text>

<text x="130" y="160" text-anchor="middle" class="label">输入</text>
<text x="130" y="190" text-anchor="middle" class="code">"if"</text>
<text x="130" y="216" text-anchor="middle" class="code">"+"</text>
<text x="130" y="242" text-anchor="middle" class="code">"define"</text>
<text x="130" y="268" text-anchor="middle" class="code">"lambda"</text>

<path d="M170 186L343 159" stroke="#0D6EFD" stroke-width="2" marker-end="url(#arr)" opacity="0.5"/>
<path d="M170 212L343 194" stroke="#0D6EFD" stroke-width="2" marker-end="url(#arr)" opacity="0.5"/>
<path d="M170 238L343 229" stroke="#0D6EFD" stroke-width="2" marker-end="url(#arr)" opacity="0.5"/>
<path d="M170 264L343 264" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arr)">
<animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
</path>

<text x="770" y="160" text-anchor="middle" class="label">输出</text>
<text x="770" y="195" text-anchor="middle" class="id">0u64</text>
<text x="770" y="222" text-anchor="middle" class="id">1u64</text>
<text x="770" y="249" text-anchor="middle" class="id">2u64</text>
<text x="770" y="276" text-anchor="middle" class="id" fill="#FF9800" opacity="0">3u64<animate attributeName="opacity" values="0;1;1" dur="2s" repeatCount="indefinite"/></text>

<path d="M555 159L740 190" stroke="#4CAF50" stroke-width="2" marker-end="url(#arr)" opacity="0.5"/>
<path d="M555 194L740 217" stroke="#4CAF50" stroke-width="2" marker-end="url(#arr)" opacity="0.5"/>
<path d="M555 229L740 244" stroke="#4CAF50" stroke-width="2" marker-end="url(#arr)" opacity="0.5"/>
<path d="M555 264L740 270" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arr)">
<animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
</path>

<circle cx="170" cy="264" r="8" fill="#FF9800" opacity="0">
<animate attributeName="opacity" values="0;1;1;1;1;0;0" dur="2s" repeatCount="indefinite"/>
<animate attributeName="cx" values="170;170;343;343;555;740;740" dur="2s" repeatCount="indefinite" keyTimes="0;0.1;0.25;0.4;0.55;0.7;1"/>
</circle>

<text x="450" y="335" text-anchor="middle" class="label" fill="#0D6EFD" font-size="18">为什么用 u64？</text>
<rect x="100" y="355" width="700" height="65" rx="10" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
<text x="450" y="380" text-anchor="middle" class="code" font-size="15">比较 Symbol：String 是 O(n) 逐字节比较，u64 是 O(1) 整数比较</text>
<text x="450" y="405" text-anchor="middle" class="code" font-size="15">哈希 Symbol：String 要逐字节算哈希，u64 的哈希是恒等函数（直接返回自己）</text>
</svg>
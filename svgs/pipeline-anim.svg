<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0D6EFD"/>
</marker>
<style>
.label { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 18px; fill: #495057; font-weight: 600; }
.detail { font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 15px; fill: #868E96; }
.flow { font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 14px; fill: #0D6EFD; font-weight: 700; }
</style>
</defs>

<rect x="20" y="70" width="170" height="110" rx="12" fill="#E3F2FD" stroke="#0D6EFD" stroke-width="2.5"/>
<text x="105" y="110" text-anchor="middle" class="label">源码 Source</text>
<text x="105" y="138" text-anchor="middle" class="detail">"(+ 1 2)"</text>

<rect x="250" y="70" width="170" height="110" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2.5"/>
<text x="335" y="110" text-anchor="middle" class="label">Tokens 词法</text>
<text x="335" y="138" text-anchor="middle" class="detail">["(", "+", "1", "2", ")"]</text>

<rect x="480" y="70" width="170" height="110" rx="12" fill="#FFF3E0" stroke="#FF9800" stroke-width="2.5"/>
<text x="565" y="110" text-anchor="middle" class="label">AST 语法树</text>
<text x="565" y="138" text-anchor="middle" class="detail">List[+, 1, 2]</text>

<rect x="710" y="70" width="170" height="110" rx="12" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2.5"/>
<text x="795" y="110" text-anchor="middle" class="label">Result 结果</text>
<text x="795" y="138" text-anchor="middle" class="detail" font-size="18" fill="#9C27B0" font-weight="700">3.0</text>

<path d="M190 125L248 125" stroke="#0D6EFD" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M420 125L478 125" stroke="#0D6EFD" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M650 125L708 125" stroke="#0D6EFD" stroke-width="2.5" marker-end="url(#ah)"/>

<text x="219" y="115" text-anchor="middle" class="flow">tokenize</text>
<text x="449" y="115" text-anchor="middle" class="flow">parse</text>
<text x="679" y="115" text-anchor="middle" class="flow">eval</text>

<circle cx="190" cy="125" r="10" fill="#0D6EFD" opacity="0">
<animate attributeName="opacity" values="0;1;1;1;1;0" dur="10s" repeatCount="indefinite" keyTimes="0;0.04;0.07;0.50;0.90;1"/>
<animate attributeName="cx" values="190;190;248;248;420;420;478;478;650;650;708;708;708" dur="10s" repeatCount="indefinite" keyTimes="0;0.04;0.07;0.11;0.15;0.19;0.23;0.27;0.31;0.35;0.39;0.90;1"/>
</circle>

<text x="450" y="220" text-anchor="middle" class="label" fill="#0D6EFD" font-size="18">数据流转过程（蓝点表示数据正在流动）</text>

<rect x="40" y="250" width="170" height="80" rx="8" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
<text x="125" y="280" text-anchor="middle" class="detail">tokenize("(+ 1 2)")</text>
<text x="125" y="305" text-anchor="middle" class="detail">→ Vec&lt;&amp;str&gt;</text>

<rect x="270" y="250" width="170" height="80" rx="8" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
<text x="355" y="280" text-anchor="middle" class="detail">parse(tokens)</text>
<text x="355" y="305" text-anchor="middle" class="detail">→ LispExp::List</text>

<rect x="500" y="250" width="170" height="80" rx="8" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
<text x="585" y="280" text-anchor="middle" class="detail">eval(ast, env)</text>
<text x="585" y="305" text-anchor="middle" class="detail">→ 1 + 2 = 3</text>

<rect x="730" y="250" width="150" height="80" rx="8" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>
<text x="805" y="280" text-anchor="middle" class="detail" font-size="13">LispExp</text>
<text x="805" y="305" text-anchor="middle" class="detail" font-size="13">::Number 3.0</text>

<rect x="710" y="70" width="170" height="110" rx="12" fill="none" stroke="#9C27B0" stroke-width="2" opacity="0">
<animate attributeName="opacity" values="0;0;0;0;0;0;0;0.8;1;1;0" dur="10s" repeatCount="indefinite" keyTimes="0;0.04;0.07;0.11;0.15;0.19;0.23;0.27;0.31;0.90;1"/>
<animate attributeName="stroke-width" values="2;2;2;2;2;2;2;2;4;4;2" dur="10s" repeatCount="indefinite" keyTimes="0;0.04;0.07;0.11;0.15;0.19;0.23;0.27;0.31;0.90;1"/>
</rect>
</svg>

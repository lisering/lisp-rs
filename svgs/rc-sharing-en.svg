<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 820 420" width="820" height="420">
  <defs>
    <marker id="arrow" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L5,2 L0,4 Z" fill="#6c757d"/>
    </marker>
  </defs>

  <!-- Problem subgraph -->
  <rect x="0" y="0" width="380" height="380" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="190" y="30" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#ef4444">Without Rc - each gets a copy</text>

  <rect x="20" y="50" width="160" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="100" y="78" text-anchor="middle" font-size="15" font-family="monospace" fill="#991b1b">Lambda₁</text>
  <text x="100" y="98" text-anchor="middle" font-size="14" font-family="monospace" fill="#991b1b">env: {x→1}</text>

  <line x1="180" y1="80" x2="240" y2="80" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="72" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#6c757d">set! x=2</text>

  <rect x="245" y="50" width="120" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="305" y="78" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#991b1b">Lambda₁ 's env</text>
  <text x="305" y="98" text-anchor="middle" font-size="14" font-family="monospace" fill="#991b1b">{x→2}</text>

  <rect x="20" y="160" width="160" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="100" y="188" text-anchor="middle" font-size="15" font-family="monospace" fill="#991b1b">Lambda₂</text>
  <text x="100" y="208" text-anchor="middle" font-size="14" font-family="monospace" fill="#991b1b">env: {x→1}</text>

  <line x1="180" y1="190" x2="240" y2="190" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="182" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#6c757d">Can't see change!</text>

  <rect x="245" y="160" width="120" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="305" y="188" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#991b1b">Lambda₂ 's env</text>
  <text x="305" y="208" text-anchor="middle" font-size="14" font-family="monospace" fill="#991b1b">{x→1}</text>

  <!-- Solution subgraph -->
  <rect x="400" y="0" width="380" height="380" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="590" y="30" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#22c55e">With Rc&lt;RefCell&gt; - shared</text>

  <rect x="420" y="50" width="120" height="45" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="78" text-anchor="middle" font-size="15" font-family="monospace" fill="#166534">Lambda₁</text>

  <line x1="540" y1="72" x2="600" y2="100" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="80" text-anchor="middle" font-size="13" font-family="monospace" fill="#6c757d">Rc::clone</text>

  <rect x="420" y="110" width="120" height="45" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="138" text-anchor="middle" font-size="15" font-family="monospace" fill="#166534">Lambda₂</text>

  <line x1="540" y1="132" x2="600" y2="120" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="148" text-anchor="middle" font-size="13" font-family="monospace" fill="#6c757d">Rc::clone</text>

  <!-- Shared env box -->
  <rect x="605" y="85" width="155" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="682" y="110" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#166534">Shared env</text>
  <text x="682" y="135" text-anchor="middle" font-size="15" font-family="monospace" fill="#166534">{x→1}</text>

  <line x1="682" y1="155" x2="682" y2="195" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="178" font-size="13" font-family="sans-serif" fill="#6c757d">set! x=2</text>

  <rect x="605" y="200" width="155" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="682" y="225" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#166534">Shared env</text>
  <text x="682" y="250" text-anchor="middle" font-size="15" font-family="monospace" fill="#166534">{x→2} ✅</text>

  <text x="682" y="295" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#166534">Both see the change!</text>
</svg>
